name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tethered-mod
          path: build/libs/*.jar
      - name: Server smoke test (Tethered Sky world, grow every stage)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'level-type=tethered\\:tethered_sky\nonline-mode=false\n' > run/server.properties
          timeout 900 ./gradlew runServer -PsmokeTest --console=plain > server.log 2>&1 || true
          echo "----- tethered lines -----"
          grep -iE "tethered|SMOKE TEST" server.log || true
          echo "----- errors / exceptions -----"
          grep -nE "ERROR|Exception" server.log | head -60 || true
          echo "----- log tail -----"
          tail -60 server.log
          grep -q "Built the Tethered starting island" server.log
          grep -q "SMOKE TEST PASSED" server.log
