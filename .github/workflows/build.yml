name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Find the newest NeoForge 21.1
        run: |
          NEO=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | grep -oE '<version>21\.1\.[0-9]+</version>' | sed -E 's/<\/?version>//g' | sort -V | tail -1)
          echo "Newest NeoForge 21.1: $NEO"
          echo "NEO=$NEO" >> "$GITHUB_ENV"
      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace -Pneo_version=$NEO
      - uses: actions/upload-artifact@v4
        with:
          name: tethered-mod
          path: build/libs/*.jar
      - name: Server smoke test (Tethered Sky world, grow every stage)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'level-type=tethered\\:tethered_sky\nonline-mode=false\n' > run/server.properties
          timeout 900 ./gradlew runServer -PsmokeTest -Pneo_version=$NEO --console=plain > server.log 2>&1 || true
          echo "----- tethered lines -----"
          grep -iE "tethered|SMOKE TEST" server.log || true
          echo "----- errors / exceptions -----"
          grep -nE "ERROR|Exception" server.log | head -60 || true
          echo "----- log tail -----"
          tail -60 server.log
          grep -q "Built the Tethered starting island" server.log
          grep -q "SMOKE TEST PASSED" server.log

  modpack:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tethered-mod
          path: jar
      - name: Find the newest NeoForge 21.1
        run: |
          NEO=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | grep -oE '<version>21\.1\.[0-9]+</version>' | sed -E 's/<\/?version>//g' | sort -V | tail -1)
          echo "Newest NeoForge 21.1: $NEO"
          echo "NEO=$NEO" >> "$GITHUB_ENV"
      - name: Build the .mrpack from modpack/mods.txt
        run: |
          JAR=$(ls jar/*.jar | head -1)
          python3 modpack/build_pack.py modpack/mods.txt "$JAR" "$NEO" out
      - uses: actions/upload-artifact@v4
        with:
          name: tethered-pack
          path: out/

  pack-smoke:
    # Starts a Tethered Sky server with the WHOLE modpack, to catch freezes/crashes between mods.
    needs: modpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: tethered-pack
          path: pack
      - name: Find the newest NeoForge 21.1
        run: |
          NEO=$(curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
            | grep -oE '<version>21\.1\.[0-9]+</version>' | sed -E 's/<\/?version>//g' | sort -V | tail -1)
          echo "Newest NeoForge 21.1: $NEO"
          echo "NEO=$NEO" >> "$GITHUB_ENV"
      - name: Install the pack's server mods
        run: python3 modpack/install_server_mods.py pack/tethered-pack.mrpack run/mods
      - name: Server smoke test with the whole pack
        run: |
          echo "eula=true" > run/eula.txt
          printf 'level-type=tethered\\:tethered_sky\nonline-mode=false\n' > run/server.properties
          ./gradlew runServer -PsmokeTest -Pneo_version=$NEO --console=plain > pack-server.log 2>&1 &
          GRADLE_PID=$!
          for i in $(seq 1 200); do
            if grep -qE "SMOKE TEST (PASSED|FAILED)|Failed to start the minecraft server|This crash report has been saved" pack-server.log; then break; fi
            if ! kill -0 $GRADLE_PID 2>/dev/null; then break; fi
            sleep 6
          done
          if ! grep -qE "SMOKE TEST (PASSED|FAILED)" pack-server.log && kill -0 $GRADLE_PID 2>/dev/null; then
            echo "===== NO RESULT AFTER 20 MIN: SERVER LOOKS STUCK. THREAD DUMP ====="
            for p in $(jps -l | grep -iE "devlaunch|bootstrap" | cut -d' ' -f1); do jstack "$p" | grep -A 80 '"Server thread"'; done
          fi
          echo "----- tethered lines -----"
          grep -iE "tethered|SMOKE TEST" pack-server.log | head -80 || true
          echo "----- errors / exceptions -----"
          grep -nE "ERROR|Exception|FATAL" pack-server.log | head -80 || true
          echo "----- log tail -----"
          tail -120 pack-server.log
          for f in run/crash-reports/*.txt; do [ -f "$f" ] && head -80 "$f"; done
          kill $GRADLE_PID 2>/dev/null || true
          grep -q "SMOKE TEST PASSED" pack-server.log
